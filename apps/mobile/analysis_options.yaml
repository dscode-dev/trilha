# Trilha — mobile static analysis.
#
# Constitution §Engineering: strictness is not relaxed to make errors go away.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # `dynamic` and implicit `any`-like behaviour are errors, not warnings (§39).
    argument_type_not_assignable: error
    invalid_assignment: error
    missing_return: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    # TODOs must be tracked, not left as silent debt (§39).
    todo: warning

  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Correctness
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unawaited_futures: true

    # Clarity
    avoid_positional_boolean_parameters: true
    prefer_final_locals: true
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    unnecessary_lambdas: true
    use_super_parameters: true

    # Flutter specifics
    use_build_context_synchronously: true
    use_colored_box: true
    use_decorated_box: true

    # Observability must not depend on print() (constitution §Engineering).
    avoid_print: true
